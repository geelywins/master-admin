name: Build WA Hub

on:
  workflow_dispatch:
  push:
    paths:
      - 'wa-hub/**'
      - '.github/workflows/wa-hub.yml'
    tags:
      - 'wa-hub-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: wa-hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Build
        run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Simpan hasil build
        uses: actions/upload-artifact@v4
        with:
          name: wa-hub-${{ matrix.os }}
          path: |
            wa-hub/dist/*.exe
            wa-hub/dist/*.dmg
          if-no-files-found: error

      - name: Lampirkan ke Release (hanya saat tag versi)
        if: startsWith(github.ref, 'refs/tags/wa-hub-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wa-hub/dist/*.exe
            wa-hub/dist/*.dmg
