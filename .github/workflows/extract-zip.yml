name: Extract ZIP

# Unggah file .zip ke folder upload/ (atau ke akar repo) lalu commit.
# Isi zip diekstrak otomatis ke akar repo, zip-nya dihapus.

on:
  push:
    branches: [main]
    paths:
      - 'upload/*.zip'
      - '*.zip'

permissions:
  contents: write
  actions: write

concurrency:
  group: extract-zip
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak zip
        run: |
          shopt -s nullglob
          zips=(upload/*.zip *.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Tidak ada zip"
            exit 0
          fi
          for z in "${zips[@]}"; do
            echo "== $z"
            # Tolak zip dengan path berbahaya (absolut atau ../)
            if unzip -Z1 "$z" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
              echo "Path tidak aman di $z, dilewati."
              continue
            fi
            tmp="$(mktemp -d)"
            unzip -q "$z" -d "$tmp"
            rm -rf "$tmp/__MACOSX"
            # .github/ dan .git/ tidak ikut disalin (token bawaan tidak boleh mengubah workflow)
            rsync -a --exclude '.git/' --exclude '.github/' --exclude '.DS_Store' "$tmp"/ ./
            if [ -d "$tmp/.github" ]; then
              echo "Catatan: folder .github di dalam $z dilewati. Unggah file workflow secara manual."
            fi
            git rm -q -f "$z"
            rm -rf "$tmp"
          done

      - name: Commit hasil ekstrak
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            echo "wa=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Ekstrak zip dari upload/"
          git push
          if git diff --name-only HEAD~1 HEAD | grep -q '^wa-hub/'; then
            echo "wa=true" >> "$GITHUB_OUTPUT"
          else
            echo "wa=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Jalankan build WA Hub
        if: steps.commit.outputs.wa == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wa-hub.yml --ref "${{ github.ref_name }}" || echo "wa-hub.yml belum ada, build dilewati."
