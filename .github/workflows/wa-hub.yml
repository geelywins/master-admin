name: Build WA Hub

# Jalan otomatis saat isi folder wa-hub berubah (termasuk dari Extract ZIP).
# Tiap versi (angka "version" di wa-hub/package.json) menjadi satu Release.
# Aplikasi WA Hub di Windows membaca Release terbaru untuk update otomatis.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wa-hub/**'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: wa-hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Build
        run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Simpan hasil build
        uses: actions/upload-artifact@v4
        with:
          name: wa-hub-${{ matrix.os }}
          path: |
            wa-hub/dist/*.exe
            wa-hub/dist/*.blockmap
            wa-hub/dist/*.dmg
            wa-hub/dist/latest.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ambil hasil build
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Baca versi
        id: v
        run: echo "version=$(node -p "require('./wa-hub/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Periksa file untuk update otomatis
        run: |
          ls -la dist
          test -f dist/latest.yml

      - name: Terbitkan Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wa-hub-v${{ steps.v.outputs.version }}
          name: WA Hub ${{ steps.v.outputs.version }}
          make_latest: true
          body: |
            Installer WA Hub versi ${{ steps.v.outputs.version }}, dibangun otomatis.
            Windows: file .exe (aplikasi yang sudah terpasang akan update sendiri). Mac: file .dmg (install manual).
            Windows menampilkan peringatan "publisher tidak dikenal" (installer tidak bertanda tangan): pilih More info, lalu Run anyway.
          files: dist/*
